# Sobe o MySQL local com o script de database/ aplicado na primeira execução.
# Uso: docker compose up -d     |     Reiniciar do zero: docker compose down -v
services:
  mysql:
    image: mysql:8.4
    container_name: snackflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lanchonete
      MYSQL_USER: snackflow
      MYSQL_PASSWORD: snackflow
    ports:
      - "3306:3306"
    healthcheck:
      # Via TCP (127.0.0.1): durante a carga do script o MySQL só escuta no socket local,
      # então o contêiner só fica "healthy" depois que database/lanchonete.sql terminou.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
