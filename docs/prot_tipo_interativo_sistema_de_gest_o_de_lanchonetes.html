    // Formata moeda BRL
    function formatBRL(val) {
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // Validação oficial de CPF (fn_cpf_valido)
    function validarCPF(cpf) {
      cpf = cpf.replace(/[^\d]+/g, '');
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
      let soma = 0, resto;
      for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.substring(9, 10))) return false;
      soma = 0;
      for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      return resto === parseInt(cpf.substring(10, 11));
    }

    // View: vw_disponibilidade_produtos (calcula quantas unidades podem ser feitas pelo ingrediente mais escasso)
    function getDisponibilidadeProduto(produto) {
      if (!produto.ativo || !produto.receita.length) return 0;
      let maxUnidades = Infinity;
      for (const itemReceita of produto.receita) {
        const ing = DB.ingredientes.find(i => i.id === itemReceita.id_ingrediente);
        if (!ing || ing.saldo <= 0) return 0;
        const possivel = Math.floor(ing.saldo / itemReceita.qtd);
        if (possivel < maxUnidades) maxUnidades = possivel;
      }
      return maxUnidades === Infinity ? 0 : maxUnidades;
    }

    // View: vw_produtos_custo (custo da receita baseado no custo médio ponderado)
    function getCustoReceita(produto) {
      let custo = 0;
      for (const itemReceita of produto.receita) {
        const ing = DB.ingredientes.find(i => i.id === itemReceita.id_ingrediente);
        if (ing) custo += ing.custo_medio * itemReceita.qtd;
      }
      return custo;
    }

    // Toast Notification (Feedback rápido conforme Design System pág. 11)
    function showToast(titulo, mensagem, tipo = 'success') {
      const container = document.getElementById('toast-container');
      const id = 'toast-' + Date.now();
      const colors = {
        success: 'border-l-4 border-l-[#16A34A] text-[#1E293B]',
        error: 'border-l-4 border-l-[#DC2626] text-[#1E293B]',
        warning: 'border-l-4 border-l-[#D97706] text-[#1E293B]',
      };
      const icons = {
        success: '<i data-lucide="check-circle-2" class="w-5 h-5 text-[#16A34A] shrink-0"></i>',
        error: '<i data-lucide="x-circle" class="w-5 h-5 text-[#DC2626] shrink-0"></i>',
        warning: '<i data-lucide="alert-triangle" class="w-5 h-5 text-[#D97706] shrink-0"></i>',
      };

      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto bg-white border border-[#E2E8F0] ${colors[tipo]} rounded-lg shadow-lg p-3.5 w-80 flex items-start gap-3 transition-all`;
      el.innerHTML = `
        ${icons[tipo]}
        <div class="flex-1">
          <div class="text-xs font-bold">${titulo}</div>
          <div class="text-xs text-[#64748B] mt-0.5">${mensagem}</div>
        </div>
      `;
      container.appendChild(el);
      lucide.createIcons();
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 3800);
    }

    // Controle de Modais
    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    // -------------------------------------------------------------------------
    // 3. AUTENTICAÇÃO E CONTROLE DE ACESSO (RBAC)
    // -------------------------------------------------------------------------
    const MENU_CONFIG = [
      {
        section: 'OPERAÇÃO',
        items: [
          { id: 'pdv', label: 'Ponto de venda', icon: 'shopping-cart', roles: ['CAIXA', 'ADMIN'] },
          { id: 'cozinha', label: 'Cozinha (KDS)', icon: 'chef-hat', roles: ['COZINHA', 'ADMIN'] },
          { id: 'estoque', label: 'Estoque', icon: 'package', roles: ['ESTOQUE', 'ADMIN'] },
        ]
      },
      {
        section: 'ADMINISTRAÇÃO',
        items: [
          { id: 'produtos', label: 'Cardápio e produtos', icon: 'utensils', roles: ['ADMIN'] },
          { id: 'funcionarios', label: 'Funcionários', icon: 'users', roles: ['ADMIN'] },
          { id: 'relatorios', label: 'Relatórios', icon: 'bar-chart-3', roles: ['ADMIN'] },
        ]
      }
    ];

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const loginInput = document.getElementById('login-user').value.trim().toLowerCase();
      const user = DB.funcionarios.find(f => f.login.toLowerCase() === loginInput);
      const errorBox = document.getElementById('login-error');

      if (!user || !user.ativo) {
        errorBox.classList.remove('hidden');
        return;
      }
      errorBox.classList.add('hidden');
      iniciarSessao(user);
    });

    function quickLogin(perfil) {
      const user = DB.funcionarios.find(f => f.perfil === perfil && f.ativo);
      if (user) iniciarSessao(user);
    }

    function iniciarSessao(user) {
      DB.currentUser = user;
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');

      document.getElementById('user-name-display').textContent = user.nome;
      document.getElementById('user-role-badge').textContent = user.perfil;
      document.getElementById('role-switcher').value = user.perfil;

      // Redirecionamento automático para a tela principal do perfil
      const defaultTabByRole = {
        ADMIN: 'pdv',
        CAIXA: 'pdv',
        COZINHA: 'cozinha',
        ESTOQUE: 'estoque'
      };
      DB.activeTab = defaultTabByRole[user.perfil] || 'pdv';

      renderSidebar();
      updateHeaderAlerts();
      renderActiveScreen();
      showToast(`Bem-vindo, ${user.nome}!`, `Sessão iniciada com perfil ${user.perfil}.`);
    }

    function logout() {
      DB.currentUser = null;
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      lucide.createIcons();
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const labels = document.querySelectorAll('.sidebar-label');
      if (sb.classList.contains('w-60')) {
        sb.classList.remove('w-60');
        sb.classList.add('w-[72px]');
        labels.forEach(l => l.classList.add('hidden'));
      } else {
        sb.classList.remove('w-[72px]');
        sb.classList.add('w-60');
        labels.forEach(l => l.classList.remove('hidden'));
      }
    }

    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav');
      const role = DB.currentUser.perfil;
      let html = '';

      MENU_CONFIG.forEach(group => {
        const visibleItems = group.items.filter(item => item.roles.includes(role));
        if (!visibleItems.length) return;

        html += `<div>
          <div class="sidebar-label px-3 mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">
            ${group.section}
          </div>
          <div class="space-y-1">`;

        visibleItems.forEach(item => {
          const isActive = DB.activeTab === item.id;
          const activeClasses = isActive
            ? 'bg-[#EA580C] text-white font-semibold shadow-sm'
            : 'text-slate-300 hover:bg-white/10 hover:text-white font-medium';

          // Badge contador para cozinha
          let badgeHtml = '';
          if (item.id === 'cozinha') {
            const emPreparo = DB.pedidos.filter(p => p.status === 'EM_PREPARO').length;
            if (emPreparo > 0) {
              badgeHtml = `<span class="sidebar-label ml-auto px-2 py-0.5 text-[11px] font-bold rounded-full ${isActive ? 'bg-white text-[#EA580C]' : 'bg-[#EA580C] text-white'}">${emPreparo}</span>`;
            }
          }

          html += `
            <button onclick="navigateTo('${item.id}')"
              class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition ${activeClasses}">
              <i data-lucide="${item.icon}" class="w-5 h-5 shrink-0"></i>
              <span class="sidebar-label truncate">${item.label}</span>
              ${badgeHtml}
            </button>`;
        });

        html += `</div></div>`;
      });

      nav.innerHTML = html;
      lucide.createIcons();
    }

    function navigateTo(tabId) {
      const role = DB.currentUser.perfil;
      const allItems = MENU_CONFIG.flatMap(g => g.items);
      const target = allItems.find(i => i.id === tabId);
      if (!target || !target.roles.includes(role)) {
        showToast('Acesso Negado', `Seu perfil (${role}) não possui permissão para esta tela.`, 'error');
        return;
      }
      DB.activeTab = tabId;
      renderSidebar();
      renderActiveScreen();
    }

    function updateHeaderAlerts() {
      const baixos = DB.ingredientes.filter(i => i.ativo && i.saldo <= i.minimo).length;
      const alertBtn = document.getElementById('header-stock-alert');
      if (baixos > 0 && ['ADMIN', 'ESTOQUE'].includes(DB.currentUser?.perfil)) {
        alertBtn.classList.remove('hidden');
        document.getElementById('header-stock-alert-text').textContent = `${baixos} insumo(s) em alerta`;
      } else {
        alertBtn.classList.add('hidden');
      }
    }

    function renderActiveScreen() {
      const titles = {
        pdv: ['Ponto de Venda', 'Ponto de Venda e Gestão de Clientes (PDV)'],
        cozinha: ['Cozinha (KDS)', 'Display de Preparo da Cozinha (KDS)'],
        estoque: ['Estoque', 'Controle e Movimentação de Estoque'],
        produtos: ['Cardápio e Produtos', 'Cadastro de Produtos e Fichas Técnicas'],
        funcionarios: ['Funcionários', 'Gerenciamento de Funcionários e Acessos'],
        relatorios: ['Relatórios', 'Relatórios e Indicadores Gerenciais'],
      };

      const [crumb, title] = titles[DB.activeTab] || ['Sistema', 'Painel'];
      document.getElementById('breadcrumb-current').textContent = crumb;
      document.getElementById('page-title').textContent = title;

      const main = document.getElementById('main-content');
      if (DB.activeTab === 'pdv') renderPDV(main);
      else if (DB.activeTab === 'cozinha') renderCozinha(main);
      else if (DB.activeTab === 'estoque') renderEstoque(main);
      else if (DB.activeTab === 'produtos') renderProdutos(main);
      else if (DB.activeTab === 'funcionarios') renderFuncionarios(main);
      else if (DB.activeTab === 'relatorios') renderRelatorios(main);

      lucide.createIcons();
    }

    // -------------------------------------------------------------------------
    // 4. TELA 2: PONTO DE VENDA (PDV / CAIXA & CLIENTES)
    // -------------------------------------------------------------------------
    function renderPDV(container) {
      const filtrados = DB.produtos.filter(p => {
        if (!p.ativo) return false;
        const matchCat = DB.pdvCategoria === 'Todos' || p.categoria === DB.pdvCategoria;
        const matchBusca = p.nome.toLowerCase().includes(DB.pdvBusca.toLowerCase());
        return matchCat && matchBusca;
      });

      // Calcula totais do carrinho
      let subtotalCarrinho = 0;
      DB.carrinho.itens.forEach(item => {
        const prod = DB.produtos.find(p => p.id === item.produtoId);
        const extrasValor = item.opcoesIds.reduce((acc, opId) => {
          const op = prod.opcoes.find(o => o.id === opId);
          return acc + (op ? op.preco : 0);
        }, 0);
        subtotalCarrinho += (prod.preco + extrasValor) * item.qtd;
      });

      // Pedidos ativos recentes para acompanhamento rápido do caixa (PRONTO / EM_PREPARO)
      const pedidosAcompanhamento = DB.pedidos.filter(p => ['EM_PREPARO', 'PRONTO'].includes(p.status));

      container.innerHTML = `
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">

                  ${DB.categorias.map(cat => `

                      class="px-3.5 h-10 rounded-lg text-xs font-semibold whitespace-nowrap transition ${

                          ? 'bg-[#EA580C] text-white'
                          : 'bg-slate-100 text-[#64748B] hover:bg-slate-200 hover:text-[#1E293B]'

                      ${cat}

                      <div>

                          <div class="w-12 h-12 rounded-xl bg-orange-50 flex items-center justify-center text-2xl shrink-0">
                            ${prod.emoji}
                          </div>
                          <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${
                            semEstoque
                              ? 'bg-red-100 text-[#DC2626]'

                                ? 'bg-amber-100 text-[#D97706]'

                      <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">

                            <button onclick="confirmarCancelamentoPedido(${ped.id})" class="px-2.5 py-1.5 rounded-lg border border-red-200 text-[#DC2626] hover:bg-red-50 font-semibold transition">

                </div>

              </div>

                    <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Novo Cliente

                  <option value="">Venda de Balcão (Anônimo)</option>

                    <option value="${c.id}" ${DB.carrinho.clienteId === c.id ? 'selected' : ''}>

                          Editar opções

                      </div>
                    </div>

                      <button onclick="DB.carrinho.pagamento = '${pg}'; renderActiveScreen();"
                        class="py-1.5 rounded-lg border text-[11px] font-semibold transition ${
                          DB.carrinho.pagamento === pg
                            ? 'bg-[#172B4D] text-white border-[#172B4D]'
                            : 'bg-white text-[#64748B] border-[#E2E8F0] hover:border-slate-300'

    function adicionarDiretoCarrinho(produtoId) {
      const prod = DB.produtos.find(p => p.id === produtoId);
      const disp = getDisponibilidadeProduto(prod);
      const jaNoCarrinho = DB.carrinho.itens
        .filter(i => i.produtoId === produtoId)
        .reduce((s, i) => s + i.qtd, 0);

      if (jaNoCarrinho + 1 > disp) {
        showToast('Limite de Estoque', `Apenas ${disp} unidade(s) disponível(is) para ${prod.nome}.`, 'warning');
        return;
      }

      const existente = DB.carrinho.itens.find(i => i.produtoId === produtoId && i.opcoesIds.length === 0 && !i.obsItem);
      if (existente) {
        existente.qtd += 1;
      } else {
        DB.carrinho.itens.push({
          uid: 'item-' + Date.now() + Math.random(),
          produtoId,
          qtd: 1,
          opcoesIds: [],
          obsItem: ''
        });
      }
      renderActiveScreen();
    }

    function alterarQtdCarrinho(uid, delta) {
      const idx = DB.carrinho.itens.findIndex(i => i.uid === uid);
      if (idx === -1) return;
      const item = DB.carrinho.itens[idx];
      const prod = DB.produtos.find(p => p.id === item.produtoId);
      const disp = getDisponibilidadeProduto(prod);

      if (delta > 0 && item.qtd + 1 > disp) {
        showToast('Estoque Insuficiente', `Disponibilidade máxima atingida (${disp} un.).`, 'warning');
        return;
      }

      item.qtd += delta;
      if (item.qtd <= 0) DB.carrinho.itens.splice(idx, 1);
      renderActiveScreen();
    }

    function removerItemCarrinho(uid) {
      DB.carrinho.itens = DB.carrinho.itens.filter(i => i.uid !== uid);
      renderActiveScreen();
    }

    // Procedure: sp_alterar_status_pedido (ABERTO -> EM_PREPARO com baixa atômica de estoque)
    function finalizarPedidoPDV() {
      if (!DB.carrinho.itens.length) return;

      // 1. Calcular consumo total de insumos para validar atomicidade
      const consumoNecessario = {}; // { id_ingrediente: qtdTotal }
      let totalVenda = 0;
      let custoTotal = 0;
      const itensFormatados = [];

      for (const item of DB.carrinho.itens) {
        const prod = DB.produtos.find(p => p.id === item.produtoId);
        // Receita base
        for (const rec of prod.receita) {
          consumoNecessario[rec.id_ingrediente] = (consumoNecessario[rec.id_ingrediente] || 0) + (rec.qtd * item.qtd);
        }
        // Adicionais
        let valorOps = 0;
        const nomesOps = [];
        for (const opId of item.opcoesIds) {
          const op = prod.opcoes.find(o => o.id === opId);
          if (op) {
            valorOps += op.preco;
            nomesOps.push(op.nome);
            if (op.id_ingrediente && op.qtd_extra > 0) {
              consumoNecessario[op.id_ingrediente] = (consumoNecessario[op.id_ingrediente] || 0) + (op.qtd_extra * item.qtd);
            }
          }
        }
        totalVenda += (prod.preco + valorOps) * item.qtd;
        itensFormatados.push({
          nome: prod.nome,
          qtd: item.qtd,
          precoUnit: prod.preco + valorOps,
          opcoes: nomesOps,
          obs: item.obsItem
        });
      }

      // 2. Verificar se algum ingrediente ficará negativo (Regra de Ouro do Banco)
      for (const [ingIdStr, qtdReq] of Object.entries(consumoNecessario)) {
        const ing = DB.ingredientes.find(i => i.id === Number(ingIdStr));
        if (!ing || ing.saldo < qtdReq) {
          showToast('Bloqueio do Banco de Dados', `Saldo insuficiente de "${ing ? ing.nome : 'Insumo'}". Nenhum item foi baixado.`, 'error');
          return;
        }
      }

      // 3. Executar baixa automática e registrar no extrato imutável
      const novoPedidoId = Math.max(...DB.pedidos.map(p => p.id), 1040) + 1;
      const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      for (const [ingIdStr, qtdReq] of Object.entries(consumoNecessario)) {
        const ing = DB.ingredientes.find(i => i.id === Number(ingIdStr));
        ing.saldo = Number((ing.saldo - qtdReq).toFixed(2));
        custoTotal += ing.custo_medio * qtdReq;

        DB.movimentacoesEstoque.unshift({
          id: Date.now() + Math.random(),
          data: `24/11/2026 ${agora}`,
          ingrediente: ing.nome,
          tipo: 'VENDA',
          qtd: `-${qtdReq} ${ing.unidade}`,
          custoUnit: ing.custo_medio,
          motivo: `Baixa automática Pedido #${novoPedidoId}`,
          responsavel: DB.currentUser.nome
        });
      }

      const cli = DB.clientes.find(c => c.id === DB.carrinho.clienteId);
      DB.pedidos.unshift({
        id: novoPedidoId,
        clienteNome: cli ? cli.nome : 'Balcão (Anônimo)',
        atendente: DB.currentUser.nome,
        pagamento: DB.carrinho.pagamento,
        status: 'EM_PREPARO',
        hora: agora,
        total: totalVenda,
        custoTotal: custoTotal,
        itens: itensFormatados,
        consumoBaixado: consumoNecessario
      });

      limparCarrinho();
      updateHeaderAlerts();
      renderSidebar();
      showToast(`Pedido #${novoPedidoId} Confirmado!`, 'Enviado para a cozinha (EM_PREPARO) e estoque baixado.');
    }

    function executarCancelamentoPedido(pedidoId) {
      const ped = DB.pedidos.find(p => p.id === pedidoId);
      if (!ped || ped.status !== 'EM_PREPARO') {
        closeModal();
        return;
      }

      // Devolve ingredientes se houver mapeamento
      if (ped.consumoBaixado) {
        const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        for (const [ingIdStr, qtdDev] of Object.entries(ped.consumoBaixado)) {
          const ing = DB.ingredientes.find(i => i.id === Number(ingIdStr));
          if (ing) {
            ing.saldo = Number((ing.saldo + qtdDev).toFixed(2));
            DB.movimentacoesEstoque.unshift({
              id: Date.now() + Math.random(),
              data: `24/11/2026 ${agora}`,
              ingrediente: ing.nome,
              tipo: 'ESTORNO',
              qtd: `+${qtdDev} ${ing.unidade}`,
              custoUnit: ing.custo_medio,
              motivo: `Devolução por cancelamento do Pedido #${pedidoId}`,
              responsavel: DB.currentUser.nome
            });
          }
        }
      }

      ped.status = 'CANCELADO';
      closeModal();
      updateHeaderAlerts();
      renderSidebar();
      renderActiveScreen();
      showToast(`Pedido #${pedidoId} Cancelado`, 'Ingredientes devolvidos ao saldo do estoque.', 'warning');
    }

      const isEntrada = tipo === 'ENTRADA';

    function executarMovimentacao(e, tipo) {
      e.preventDefault();
      const ingId = Number(document.getElementById('mov-ing').value);
      const qtd = Number(document.getElementById('mov-qtd').value);
      const motivo = document.getElementById('mov-motivo').value.trim();
      const ing = DB.ingredientes.find(i => i.id === ingId);

      if (!ing) return;

      const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      if (tipo === 'ENTRADA') {
        const custoNovo = Number(document.getElementById('mov-custo').value);
        // Recálculo do Custo Médio Ponderado
        const valorTotalAnterior = ing.saldo * ing.custo_medio;
        const valorTotalCompra = qtd * custoNovo;
        const novoSaldo = ing.saldo + qtd;
        ing.custo_medio = Number(((valorTotalAnterior + valorTotalCompra) / novoSaldo).toFixed(4));
        ing.saldo = Number(novoSaldo.toFixed(2));

        DB.movimentacoesEstoque.unshift({
          id: Date.now(),
          data: `24/11/2026 ${agora}`,
          ingrediente: ing.nome,
          tipo: 'ENTRADA',
          qtd: `+${qtd} ${ing.unidade}`,
          custoUnit: custoNovo,
          motivo,
          responsavel: DB.currentUser.nome
        });
        showToast('Compra Registrada', `Custo médio de ${ing.nome} recalculado para ${formatBRL(ing.custo_medio)}.`);
      } else {
        if (ing.saldo < qtd) {
          showToast('Operação Recusada', 'O saldo do estoque não pode ficar negativo.', 'error');
          return;
        }
        ing.saldo = Number((ing.saldo - qtd).toFixed(2));
        DB.movimentacoesEstoque.unshift({
          id: Date.now(),
          data: `24/11/2026 ${agora}`,
          ingrediente: ing.nome,
          tipo: 'PERDA',
          qtd: `-${qtd} ${ing.unidade}`,
          custoUnit: ing.custo_medio,
          motivo,
          responsavel: DB.currentUser.nome
        });
        showToast('Perda Registrada', `Baixa de ${qtd} ${ing.unidade} de ${ing.nome} auditada.`, 'warning');
      }

      closeModal();
      updateHeaderAlerts();
      renderActiveScreen();
    }

                ${DB.ingredientes.map(i => `<option value="${i.id}">${i.nome} (${i.unidade})</option>`).join('')}
              </select>
              <input type="number" id="prod-ing-qtd" required min="1" value="1" placeholder="Qtd" class="h-9 px-2.5 rounded-lg border border-[#E2E8F0] text-xs" />
            </div>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="h-10 px-4 rounded-lg border border-[#E2E8F0] text-xs font-semibold">Cancelar</button>
            <button type="submit" class="h-10 px-4 rounded-lg bg-[#EA580C] text-white text-xs font-semibold">Salvar Produto</button>
          </div>
        </form>
      `);
    }

    function salvarNovoProduto(e) {
      e.preventDefault();
      const nome = document.getElementById('prod-nome').value.trim();
      const preco = Number(document.getElementById('prod-preco').value);
      const categoria = document.getElementById('prod-cat').value;
      const id_ingrediente = Number(document.getElementById('prod-ing').value);
      const qtd = Number(document.getElementById('prod-ing-qtd').value);

      DB.produtos.push({
        id: Date.now(),
        nome,
        categoria,
        preco,
        ativo: true,
        emoji: '🍽️',
        receita: [{ id_ingrediente, qtd }],
        opcoes: []
      });

      closeModal();
      renderActiveScreen();
      showToast('Produto Adicionado', `${nome} já está disponível no PDV.`);
    }

    // -------------------------------------------------------------------------
    // 8. TELA 6: GERENCIAMENTO DE FUNCIONÁRIOS E USUÁRIOS (RBAC)
    // -------------------------------------------------------------------------
    function renderFuncionarios(container) {
      const roleBadges = {
        CAIXA: 'bg-blue-100 text-[#2563EB]',
        COZINHA: 'bg-purple-100 text-purple-700',
        ESTOQUE: 'bg-amber-100 text-amber-800',
        ADMIN: 'bg-[#172B4D] text-white'
      };

      container.innerHTML = `
        <div class="bg-white rounded-xl border border-[#E2E8F0] shadow-xs overflow-hidden">
          <div class="p-4 border-b border-[#E2E8F0] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 class="text-base font-bold text-[#1E293B]">Equipe e Controle de Acesso (RBAC)</h2>
              <p class="text-xs text-[#64748B]">Colaboradores inativados têm login bloqueado mantendo histórico de auditoria</p>
            </div>
            <button onclick="abrirModalNovoFuncionario()" class="h-10 px-4 rounded-lg bg-[#EA580C] hover:bg-[#C2410C] text-white text-xs font-semibold flex items-center gap-2">
              <i data-lucide="user-plus" class="w-4 h-4"></i> Novo Funcionário
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-[#E2E8F0] text-[11px] font-semibold uppercase text-[#64748B]">
                  <th class="py-3 px-4">Nome</th>
                  <th class="py-3 px-4">Cargo</th>
                  <th class="py-3 px-4">Login</th>
                  <th class="py-3 px-4">Perfil RBAC</th>
                  <th class="py-3 px-4">Status</th>
                  <th class="py-3 px-4 text-right">Ações</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#E2E8F0] text-xs">
                ${DB.funcionarios.map(f => `
                  <tr class="hover:bg-slate-50/70">
                    <td class="py-3.5 px-4 font-bold text-[#1E293B]">${f.nome}</td>
                    <td class="py-3.5 px-4 text-[#64748B]">${f.cargo}</td>
                    <td class="py-3.5 px-4 font-mono text-[#64748B]">${f.login}</td>
                    <td class="py-3.5 px-4">
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${roleBadges[f.perfil]}">${f.perfil}</span>
                    </td>
                    <td class="py-3.5 px-4">
                      ${f.ativo
                        ? '<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-green-100 text-[#16A34A]">Ativo</span>'
                        : '<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-[#64748B]">Inativo</span>'}
                    </td>
                    <td class="py-3.5 px-4 text-right">
                      <button onclick="alternarStatusFuncionario(${f.id})" class="px-2.5 py-1 rounded border border-[#E2E8F0] hover:bg-slate-50 text-[11px] font-semibold">
                        ${f.ativo ? 'Desativar' : 'Reativar'}
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function alternarStatusFuncionario(id) {
      const f = DB.funcionarios.find(u => u.id === id);
      if (!f) return;
      if (f.id === DB.currentUser.id) {
        showToast('Ação Bloqueada', 'Você não pode desativar seu próprio usuário logado.', 'error');
        return;
      }
      f.ativo = !f.ativo;
      renderActiveScreen();
      showToast('Status Alterado', `Acesso de ${f.nome} agora está ${f.ativo ? 'ATIVO' : 'INATIVO'}.`);
    }

    function abrirModalNovoFuncionario() {
      openModal(`
        <div class="p-5 border-b border-[#E2E8F0] flex items-center justify-between">
          <h3 class="font-bold text-base text-[#1E293B]">Cadastrar Colaborador</h3>
          <button onclick="closeModal()" class="text-[#64748B]"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="salvarNovoFuncionario(event)" class="p-5 space-y-4">
          <div>
            <label class="block text-xs font-semibold mb-1">Nome Completo <span class="text-red-600">*</span></label>
            <input type="text" id="func-nome" required placeholder="Ex.: Fernanda Lima" class="w-full h-10 px-3 rounded-lg border border-[#E2E8F0] text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold mb-1">Cargo <span class="text-red-600">*</span></label>
              <input type="text" id="func-cargo" required placeholder="Ex.: Atendente" class="w-full h-10 px-3 rounded-lg border border-[#E2E8F0] text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Perfil de Acesso <span class="text-red-600">*</span></label>
              <select id="func-perfil" class="w-full h-10 px-3 rounded-lg border border-[#E2E8F0] text-sm bg-white">
                <option value="CAIXA">CAIXA</option>
                <option value="COZINHA">COZINHA</option>
                <option value="ESTOQUE">ESTOQUE</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Login Único <span class="text-red-600">*</span></label>
            <input type="text" id="func-login" required placeholder="Ex.: fernanda.caixa" class="w-full h-10 px-3 rounded-lg border border-[#E2E8F0] text-sm" />
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="h-10 px-4 rounded-lg border border-[#E2E8F0] text-xs font-semibold">Cancelar</button>
            <button type="submit" class="h-10 px-4 rounded-lg bg-[#EA580C] text-white text-xs font-semibold">Criar Usuário</button>
          </div>
        </form>
      `);
    }

    function salvarNovoFuncionario(e) {
      e.preventDefault();
      const nome = document.getElementById('func-nome').value.trim();
      const cargo = document.getElementById('func-cargo').value.trim();
      const perfil = document.getElementById('func-perfil').value;
      const login = document.getElementById('func-login').value.trim().toLowerCase();

      DB.funcionarios.push({ id: Date.now(), nome, cargo, login, perfil, ativo: true });
      closeModal();
      renderActiveScreen();
      showToast('Colaborador Cadastrado', `${nome} (${perfil}) criado com senha criptografada.`);
    }

    // -------------------------------------------------------------------------
    // 9. TELA 7: RELATÓRIOS E INDICADORES GERENCIAIS
    // -------------------------------------------------------------------------
    function renderRelatorios(container) {
      const validos = DB.pedidos.filter(p => p.status !== 'CANCELADO');
      const faturamentoBruto = validos.reduce((s, p) => s + p.total, 0);
      const custoInsumos = validos.reduce((s, p) => s + (p.custoTotal || 0), 0);
      const lucroLiquido = faturamentoBruto - custoInsumos;
      const ticketMedio = validos.length ? faturamentoBruto / validos.length : 0;

      // Agrupamento por forma de pagamento
      const porPagamento = {};
      validos.forEach(p => {
        porPagamento[p.pagamento] = (porPagamento[p.pagamento] || 0) + p.total;
      });

      // Sugestão de compras (insumos abaixo do mínimo)
      const sugestaoCompras = DB.ingredientes.filter(i => i.saldo <= i.minimo);

      container.innerHTML = `
        <div class="space-y-6">
          <!-- KPIs Gerenciais -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-[#E2E8F0] shadow-2xs">
              <span class="text-xs font-semibold text-[#64748B]">Faturamento Bruto (Hoje)</span>
              <div class="text-2xl font-bold text-[#1E293B] mt-2">${formatBRL(faturamentoBruto)}</div>
              <div class="text-xs text-[#16A34A] font-medium mt-1">${validos.length} pedido(s) válido(s)</div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-[#E2E8F0] shadow-2xs">
              <span class="text-xs font-semibold text-[#64748B]">Custo Exato dos Insumos</span>
              <div class="text-2xl font-bold text-[#64748B] mt-2">${formatBRL(custoInsumos)}</div>
              <div class="text-xs text-[#64748B] mt-1">Baixados nas receitas</div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-[#E2E8F0] shadow-2xs">
              <span class="text-xs font-semibold text-[#64748B]">Lucro Líquido Operacional</span>
              <div class="text-2xl font-bold text-[#16A34A] mt-2">${formatBRL(lucroLiquido)}</div>
              <div class="text-xs text-[#64748B] mt-1">Margem real: ${faturamentoBruto > 0 ? ((lucroLiquido / faturamentoBruto) * 100).toFixed(1) : 0}%</div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-[#E2E8F0] shadow-2xs">
              <span class="text-xs font-semibold text-[#64748B]">Ticket Médio</span>
              <div class="text-2xl font-bold text-[#2563EB] mt-2">${formatBRL(ticketMedio)}</div>
              <div class="text-xs text-[#64748B] mt-1">Por pedido concluído</div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Vendas por Forma de Pagamento -->
            <div class="bg-white p-5 rounded-xl border border-[#E2E8F0] shadow-xs space-y-4">
              <h3 class="text-sm font-bold text-[#1E293B]">Faturamento por Forma de Pagamento</h3>
              <div class="space-y-3">
                ${Object.entries(porPagamento).map(([forma, valor]) => {
                  const pct = faturamentoBruto > 0 ? (valor / faturamentoBruto) * 100 : 0;
                  return `
                    <div>
                      <div class="flex justify-between text-xs font-semibold mb-1">
                        <span>${forma}</span>
                        <span>${formatBRL(valor)} (${pct.toFixed(0)}%)</span>
                      </div>
                      <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full bg-[#EA580C] rounded-full" style="width: ${pct}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Relatório de Planejamento de Compras -->
            <div class="bg-white p-5 rounded-xl border border-[#E2E8F0] shadow-xs space-y-4">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="text-sm font-bold text-[#1E293B]">Planejamento de Compras (Reposição)</h3>
                  <p class="text-xs text-[#64748B]">Insumos abaixo do estoque mínimo de segurança</p>
                </div>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-[#D97706]">${sugestaoCompras.length} item(ns)</span>
              </div>

              ${sugestaoCompras.length === 0 ? `
                <p class="text-xs text-[#16A34A] font-medium py-4">Todos os insumos estão acima do estoque mínimo!</p>
              ` : `
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="border-b border-[#E2E8F0] text-[#64748B]">
                      <th class="py-2">Insumo</th>
                      <th class="py-2 text-right">Atual</th>
                      <th class="py-2 text-right">Mínimo</th>
                      <th class="py-2 text-right">Sugestão Compra</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[#E2E8F0]">
                    ${sugestaoCompras.map(i => `
                      <tr>
                        <td class="py-2.5 font-semibold">${i.nome}</td>
                        <td class="py-2.5 text-right text-[#DC2626] font-bold">${i.saldo} ${i.unidade}</td>
                        <td class="py-2.5 text-right text-[#64748B]">${i.minimo} ${i.unidade}</td>
                        <td class="py-2.5 text-right font-bold text-[#16A34A]">+${(i.minimo * 2) - i.saldo} ${i.unidade}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // Inicializa ícones na carga da página
    window.onload = function() {
      lucide.createIcons();
    };
  </script>
</body>
</html>
