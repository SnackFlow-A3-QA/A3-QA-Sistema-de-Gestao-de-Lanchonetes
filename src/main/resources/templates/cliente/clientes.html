<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('clientes')}"></nav>
<main class="container pb-5">
    <h1 class="h3 mb-3">Gestão de Clientes</h1>

    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <!-- Cadastro / edição -->
    <form th:action="@{/clientes}" th:object="${form}" method="post" class="card card-body mb-4">
        <input type="hidden" th:field="*{id}">
        <div class="row g-2">
            <div class="col-12 col-md-4">
                <label class="form-label" for="nome">Nome *</label>
                <input type="text" id="nome" class="form-control" th:field="*{nome}" maxlength="100">
                <small class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="cpf">CPF</label>
                <input type="text" id="cpf" class="form-control" th:field="*{cpf}" maxlength="14" placeholder="000.000.000-00">
                <small class="text-danger" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></small>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="telefone">Telefone</label>
                <input type="text" id="telefone" class="form-control" th:field="*{telefone}" maxlength="20">
                <small class="text-danger" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></small>
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label" for="email">E-mail</label>
                <input type="email" id="email" class="form-control" th:field="*{email}" maxlength="100">
                <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
            </div>
        </div>
        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-success"
                    th:text="${form.id == null} ? 'Cadastrar' : 'Atualizar'">Cadastrar</button>
            <a th:if="${form.id != null}" th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>

    <!-- Busca -->
    <form method="get" th:action="@{/clientes}" class="row g-2 align-items-center mb-3">
        <div class="col-12 col-md">
            <input type="text" name="busca" th:value="${busca}" class="form-control" placeholder="Buscar por nome ou CPF">
        </div>
        <div class="col-auto form-check ms-2">
            <input class="form-check-input" type="checkbox" id="inativos" name="inativos" value="true" th:checked="${inativos}">
            <label class="form-check-label" for="inativos">Mostrar inativos</label>
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Buscar</button>
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Limpar</a>
        </div>
    </form>

    <!-- Lista -->
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th><th>Situação</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nome}"></td>
                <td th:text="${c.cpfFormatado}"></td>
                <td th:text="${c.telefone}"></td>
                <td th:text="${c.email}"></td>
                <td>
                    <span class="badge" th:classappend="${c.ativo} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${c.ativo} ? 'Ativo' : 'Inativo'"></span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes(editar=${c.id})}">Editar</a>
                    <form th:action="@{/clientes/{id}/situacao(id=${c.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Confirma a alteração da situação deste cliente?');">
                        <input type="hidden" name="ativo" th:value="${!c.ativo}">
                        <button type="submit" class="btn btn-sm"
                                th:classappend="${c.ativo} ? 'btn-outline-danger' : 'btn-outline-success'"
                                th:text="${c.ativo} ? 'Inativar' : 'Reativar'">Inativar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="7" class="text-center text-muted">Nenhum cliente encontrado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
