<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - SnackFlow'">SnackFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="menu(ativo)" class="navbar navbar-expand-sm navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">SnackFlow</span>
        <div class="navbar-nav">
            <a class="nav-link" th:classappend="${ativo == 'clientes'} ? 'active'" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link" th:classappend="${ativo == 'relatorios'} ? 'active'" th:href="@{/relatorios}">Relatórios</a>
            <form th:action="@{/logout}" method="post" class="d-inline ms-2">
                <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
