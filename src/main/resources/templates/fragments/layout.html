<!DOCTYPE html>
<!--
  LAYOUT COMPARTILHADO DO SNACKFLOW (arquivo compartilhado: não altere sem alinhar com o grupo).

  Uso em qualquer tela de módulo (a tag <html> da página inteira é substituída):

    <!DOCTYPE html>
    <html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
          th:replace="~{fragments/layout :: pagina('Produtos', 'Cardápio e produtos', ~{::conteudo})}">
    <body>
    <section th:fragment="conteudo"> ...HTML da tela... </section>
    </body>
    </html>

  Parâmetros: 1) texto do breadcrumb e do <title>; 2) título (h1) da página; 3) o fragmento "conteudo".
  O modelo recebe automaticamente usuarioNome, usuarioPerfil e menuSecoes (LayoutAdvice).
  Flash/modelo "ok" e "erro" viram toast sozinhos.
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, subtitulo, conteudo)">
<head th:replace="~{fragments/base :: cabecaBase(${titulo})}"></head>
<body class="antialiased bg-brand-bg text-brand-text selection:bg-orange-100">

<a href="#conteudo-principal"
   class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50 focus:rounded-lg focus:bg-white focus:px-3 focus:py-2">
    Ir para o conteúdo
</a>

<div class="flex min-h-screen">

    <div id="sidebar-overlay" class="fixed inset-0 z-20 bg-slate-900/50 lg:hidden" hidden></div>

    <!-- Menu lateral (240px; 72px recolhido). Itens já filtrados pelo perfil (MenuService). -->
    <aside id="sidebar"
           class="fixed inset-y-0 left-0 z-30 flex w-60 shrink-0 -translate-x-full flex-col bg-brand-dark text-white lg:static lg:translate-x-0">
        <div class="flex h-16 items-center justify-between border-b border-white/10 px-4">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-brand-orange">
                    <i data-lucide="utensils" class="h-5 w-5 text-white"></i>
                </div>
                <div class="sf-sidebar-rotulo truncate">
                    <div class="text-sm font-bold leading-tight">SnackFlow</div>
                    <div class="text-[11px] text-slate-400">Gestão de lanchonetes</div>
                </div>
            </div>
            <button id="btn-recolher-menu" type="button" aria-expanded="true" aria-label="Recolher menu"
                    class="hidden rounded-md p-1 text-slate-400 hover:text-white lg:block">
                <i data-lucide="panel-left-close" class="h-4 w-4"></i>
            </button>
        </div>

        <nav class="flex-1 space-y-5 overflow-y-auto px-3 py-4" aria-label="Menu principal">
            <div th:each="secao : ${menuSecoes}">
                <div class="sf-sidebar-rotulo mb-2 px-3 text-[11px] font-semibold uppercase tracking-wider text-slate-400"
                     th:text="${secao.titulo}">Seção</div>
                <div class="space-y-1">
                    <a th:each="item : ${secao.itens}"
                       th:href="@{${item.rota}}"
                       th:title="${item.rotulo}"
                       th:attr="aria-current=${item.ativo} ? 'page'"
                       th:classappend="${item.ativo} ? 'bg-brand-orange font-semibold text-white shadow-sm' : 'font-medium text-slate-300 hover:bg-white/10 hover:text-white'"
                       class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm transition">
                        <i th:attr="data-lucide=${item.icone}" class="h-5 w-5 shrink-0"></i>
                        <span class="sf-sidebar-rotulo truncate" th:text="${item.rotulo}">Item</span>
                    </a>
                </div>
            </div>
        </nav>

        <div class="border-t border-white/10 bg-black/15 p-3">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 overflow-hidden">
                    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white/10 text-slate-200">
                        <i data-lucide="user" class="h-4 w-4"></i>
                    </div>
                    <div class="sf-sidebar-rotulo truncate">
                        <div class="truncate text-xs font-semibold" th:text="${usuarioNome}">Nome</div>
                        <span class="mt-0.5 inline-block rounded bg-orange-500/20 px-1.5 text-[10px] font-bold text-orange-300"
                              th:text="${usuarioPerfil}">PERFIL</span>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post" data-sem-carregamento>
                    <button type="submit" title="Encerrar sessão" aria-label="Encerrar sessão"
                            class="rounded-lg p-2 text-slate-400 transition hover:bg-white/10 hover:text-white">
                        <i data-lucide="log-out" class="h-4 w-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
        <header class="flex h-16 shrink-0 items-center gap-3 border-b border-brand-border bg-white px-4 sm:px-6">
            <button id="btn-menu-movel" type="button" aria-expanded="false" aria-label="Abrir menu"
                    class="rounded-md p-2 text-brand-muted hover:bg-slate-100 lg:hidden">
                <i data-lucide="menu" class="h-5 w-5"></i>
            </button>
            <div class="min-w-0">
                <div class="flex items-center gap-2 text-xs text-brand-muted">
                    <span>SnackFlow</span>
                    <i data-lucide="chevron-right" class="h-3.5 w-3.5"></i>
                    <span class="truncate font-medium text-brand-text" th:text="${titulo}">Tela</span>
                </div>
                <h1 class="truncate text-xl font-bold leading-tight sm:text-[28px]" th:text="${subtitulo}">Título da página</h1>
            </div>
        </header>

        <main id="conteudo-principal" class="flex-1 overflow-y-auto p-4 sm:p-6">
            <section th:replace="${conteudo}">conteúdo do módulo</section>
        </main>
    </div>
</div>

<!-- Toasts: containers e mensagens vindas do servidor (flash/modelo "ok" e "erro") -->
<div id="toast-container" class="pointer-events-none fixed bottom-5 right-5 z-50 flex flex-col gap-2"
     aria-live="polite"></div>
<div id="toasts-servidor" hidden>
    <span th:if="${ok}" data-tipo="sucesso" data-titulo="Sucesso" th:data-mensagem="${ok}"></span>
    <span th:if="${erro}" data-tipo="erro" data-titulo="Erro" th:data-mensagem="${erro}"></span>
</div>

<!-- Modal de confirmação (acionado por data-confirmar-mensagem em botões e links) -->
<div id="modal-confirmacao" class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/50 p-4"
     role="dialog" aria-modal="true" aria-labelledby="modal-confirmacao-titulo" hidden>
    <div class="w-full max-w-md space-y-4 rounded-xl border border-brand-border bg-white p-6 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-amber-100 text-[#D97706]">
                <i data-lucide="alert-triangle" class="h-5 w-5"></i>
            </div>
            <h2 id="modal-confirmacao-titulo" class="text-lg font-bold">Confirmar ação</h2>
        </div>
        <p id="modal-confirmacao-mensagem" class="text-sm text-brand-muted"></p>
        <div class="flex justify-end gap-2.5 pt-2">
            <button id="modal-confirmacao-cancelar" type="button" class="sf-btn sf-btn-contorno">Voltar</button>
            <button id="modal-confirmacao-confirmar" type="button" class="sf-btn sf-btn-perigo">Confirmar</button>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/base :: scriptsBase}"></th:block>
</body>
</html>
