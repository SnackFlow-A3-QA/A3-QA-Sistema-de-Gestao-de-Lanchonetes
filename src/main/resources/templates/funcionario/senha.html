<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Funcionários', 'Redefinir senha', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <div class="sf-cartao max-w-2xl">
        <div class="sf-cartao-corpo">
            <p class="mb-4 text-sm text-brand-muted">
                Nova senha para <strong th:text="${nomeFuncionario}">Funcionário</strong>.
            </p>
            <form th:action="@{${acao}}" th:object="${form}" method="post">
                <div th:replace="~{fragments/componentes :: campoTexto('Nova senha', 'senha', true, 'password', 'Mínimo de 6 caracteres')}"></div>
                <div class="flex justify-end gap-2.5 pt-2">
                    <a th:replace="~{fragments/componentes :: linkBotao('/funcionarios', 'Cancelar', 'x', 'contorno')}"></a>
                    <button th:replace="~{fragments/componentes :: botao('Redefinir senha', 'key-round', 'primario')}"></button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
