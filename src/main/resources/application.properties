spring.application.name=SnackFlow

# Conexão com o MySQL (valores padrão batem com o docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lanchonete}
spring.datasource.username=${DB_USER:snackflow}
spring.datasource.password=${DB_PASSWORD:snackflow}

# O esquema do banco vem do script em database/; o Hibernate não o altera
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Locale fixo em pt-BR: mensagens de Bean Validation e formatação em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# JPA sem SQL no console
spring.jpa.show-sql=false

# Thymeleaf: cache ligado por padrão; desligue em desenvolvimento com THYMELEAF_CACHE=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Sessão: cookie não acessível por JavaScript e sem envio em requisições entre sites
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Páginas de erro nunca vazam detalhes internos
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
