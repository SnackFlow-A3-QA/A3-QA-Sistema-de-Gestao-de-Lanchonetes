spring.application.name=SnackFlow

# Conexão com o MySQL (valores padrão batem com o docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lanchonete}
spring.datasource.username=${DB_USER:snackflow}
spring.datasource.password=${DB_PASSWORD:snackflow}

# O esquema do banco vem do script em database/; o Hibernate não o altera
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
